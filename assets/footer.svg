<svg xmlns="http://www.w3.org/2000/svg" width="864" height="104" viewBox="-2 -2 864 104"><defs><style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes pulse{0%,100%{r:4}50%{r:6.5}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(600px)}}
@keyframes grow{0%{transform:scaleX(0)}60%,100%{transform:scaleX(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes sweep{0%{transform:translateX(-300px)}100%{transform:translateX(1200px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.tw{animation:tw 3.2s ease-in-out infinite}
.pl{animation:pulse 2.4s ease-in-out infinite}
.fl{stroke-dasharray:4 6;animation:flow 2.2s linear infinite}
.sl{animation:slide 10s ease-in-out infinite}
.gr{transform-box:fill-box;transform-origin:left;animation:grow 3.5s ease-out infinite alternate}
.bk{animation:blink 1s step-end infinite}
.sw{animation:sweep 6s linear infinite}
.ft{animation:float 4s ease-in-out infinite}
</style><linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#8b6cff"/><stop offset=".5" stop-color="#38d9f5" stop-opacity=".6"/><stop offset="1" stop-color="#38d9f5" stop-opacity="0"/></linearGradient><linearGradient id="cardg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151d3d"/><stop offset="1" stop-color="#0e1430"/></linearGradient><linearGradient id="fg" x1="0" x2="1"><stop offset="0" stop-color="#14367a"/><stop offset=".5" stop-color="#3a2a92"/><stop offset="1" stop-color="#6e2fb4"/></linearGradient>
<linearGradient id="fsh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="fc"><rect width="860" height="100" rx="16"/></clipPath></defs><rect width="860" height="100" rx="16" fill="url(#fg)"/>
<g clip-path="url(#fc)"><rect class="sw" x="0" y="0" width="220" height="100" fill="url(#fsh)"/></g>
<text x="430.0" y="50" text-anchor="middle" class="s" font-size="21" font-weight="800" fill="#fff">Build models · Measure honestly · Ship what works</text>
<text x="430.0" y="76" text-anchor="middle" class="m" font-size="10" letter-spacing="3.5" fill="#fff" fill-opacity=".7">THANKS FOR STOPPING BY</text></svg>