 width="250" height="9" rx="4.5" fill="#1b2450"/><rect class="gr" x="88" y="94" width="185" height="9" rx="4.5" fill="#ff7ac6" style="animation-delay:0.3s"/><text x="348" y="102" class="m" font-size="10" fill="#eef2ff">F1 0.74</text><text x="20" y="122" class="m" font-size="10" fill="#8a97ba">neutral</text><rect x="88" y="114" width="250" height="9" rx="4.5" fill="#1b2450"/><rect class="gr" x="88" y="114" width="118" height="9" rx="4.5" fill="#ffc65c" style="animation-delay:0.6s"/><text x="348" y="122" class="m" font-size="10" fill="#eef2ff">F1 0.47</text><text x="20" y="152" class="s" font-size="12.5" font-weight="400" fill="#c3cdea"><tspan x="20" dy="0">LSTM classifier trained on Amazon Fine Food Reviews</tspan><tspan x="20" dy="17">(positive / neutral / negative), plus DistilBART</tspan><tspan x="20" dy="17">summarization, deployed as a Gradio app on Hugging Face.</tspan></text><rect x="20" y="196" width="42.8" height="20" rx="10" fill="#070b1c" fill-opacity=".6" stroke="#38d9f5" stroke-opacity=".45"/><text x="41.4" y="209.5" text-anchor="middle" class="m" font-size="10" fill="#eef2ff">LSTM</text><rect x="68.8" y="196" width="80.0" height="20" rx="10" fill="#070b1c" fill-opacity=".6" stroke="#38d9f5" stroke-opacity=".45"/><text x="108.8" y="209.5" text-anchor="middle" class="m" font-size="10" fill="#eef2ff">TensorFlow</text><rect x="154.8" y="196" width="80.0" height="20" rx="10" fill="#070b1c" fill-opacity=".6" stroke="#38d9f5" stroke-opacity=".45"/><text x="194.8" y="209.5" text-anchor="middle" class="m" font-size="10" fill="#eef2ff">DistilBART</text><rect x="240.8" y="196" width="55.2" height="20" rx="10" fill="#070b1c" fill-opacity=".6" stroke="#38d9f5" stroke-opacity=".45"/><text x="268.40000000000003" y="209.5" text-anchor="middle" class="m" font-size="10" fill="#eef2ff">Gradio</text><text x="20" y="236" class="s" font-size="12.5" font-weight="700" fill="#38d9f5">Explore project →</text></svg>