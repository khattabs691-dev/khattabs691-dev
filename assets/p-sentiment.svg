.sl{animation:slide 10s ease-in-out infinite}
.gr{transform-box:fill-box;transform-origin:left;animation:grow 3.5s ease-out infinite alternate}
.bk{animation:blink 1s step-end infinite}
.sw{animation:sweep 6s linear infinite}
.ft{animation:float 4s ease-in-out infinite}
@keyframes glm{0%{transform:translateX(-300px) skewX(-20deg)}50%,100%{transform:translateX(1300px) skewX(-20deg)}}
.glm{animation:glm 7s ease-in-out infinite}
