<svg xmlns="http://www.w3.org/2000/svg" width="424" height="254" viewBox="-2 -2 424 254"><defs><style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes pulse{0%,100%{r:4}50%{r:6.5}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(600px)}}
@keyframes grow{0%{transform:scaleX(0)}60%,100%{transform:scaleX(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes sweep{0%{transform:translateX(-300px)}100%{transform:translateX(1200px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.tw{animation:tw 3.2s ease-in-out infinite}
.pl{animation:pulse 2.4s ease-in-out infinite}
.fl{stroke-dasharray:4 6;animation:flow 2.2s linear infinite}
.sl{animation:slide 10s ease-in-out infinite}
.gr{transform-box:fill-box;transform-origin:left;animation:grow 3.5s ease-out infinite alternate}
.bk{animation:blink 1s step-end infinite}
.sw{animation:sweep 6s linear infinite}
.ft{animation:float 4s ease-in-out infinite}
