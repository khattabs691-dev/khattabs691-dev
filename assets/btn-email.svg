<svg xmlns="http://www.w3.org/2000/svg" width="280" height="74" viewBox="-2 -2 280 74" xmlns:c2pa="http://c2pa.org/manifest"><defs><style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes pulse{0%,100%{r:4}50%{r:6.5}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(600px)}}
@keyframes grow{0%{transform:scaleX(0)}60%,100%{transform:scaleX(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes sweep{0%{transform:translateX(-300px)}100%{transform:translateX(1200px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes role{0%{opacity:0}4%,30%{opacity:1}34%,100%{opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.tw{animation:tw 3.2s ease-in-out infinite}
.pl{animation:pulse 2.4s ease-in-out infinite}
.fl{stroke-dasharray:4 6;animation:flow 2.2s linear infinite}
.sl{animation:slide 10s ease-in-out infinite}
.gr{transform-box:fill-box;transform-origin:left;animation:grow 3.5s ease-out infinite alternate}
.bk{animation:blink 1s step-end infinite}
.sw{animation:sweep 6s linear infinite}
.ft{animation:float 4s ease-in-out infinite}
@keyframes gl{0%{transform:translateX(-160px) skewX(-20deg)}55%,100%{transform:translateX(420px) skewX(-20deg)}}
.gl{animation:gl 4.5s ease-in-out infinite}
</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22272e"/><stop offset=".55" stop-color="#161b22"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset=".35" stop-color="#79b8ff" stop-opacity=".55"/><stop offset="1" stop-color="#2f81f7" stop-opacity=".25"/></linearGradient>
<linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".16"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".04"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<radialGradient id="glow" cx=".12" cy=".5" r=".6"><stop offset="0" stop-color="#79b8ff" stop-opacity=".28"/><stop offset="1" stop-color="#79b8ff" stop-opacity="0"/></radialGradient>
<linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".18"/><stop offset="1" stop-color="#ffffff" stop-opacity=".05"/></linearGradient>
<clipPath id="cp"><rect width="276" height="70" rx="14"/></clipPath></defs>
<rect width="276" height="70" rx="14" fill="url(#bg)"/>
<rect width="276" height="70" rx="14" fill="url(#glow)"/>
<rect width="276" height="70" rx="14" fill="url(#top)"/>
<g clip-path="url(#cp)"><rect class="gl" style="animation-delay:0s" x="0" y="-20" width="60" height="110" fill="url(#shine)"/></g>
<rect x=".75" y=".75" width="274.5" height="68.5" rx="13.5" fill="none" stroke="url(#bd)" stroke-width="1.5"/>
<rect x="18" y="18" width="34" height="34" rx="9" fill="url(#tile)" stroke="#ffffff" stroke-opacity=".28"/>
<rect stroke="#79b8ff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" x="26" y="29" width="18" height="13" rx="2.5"/><path stroke="#79b8ff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M27 31l8 6 8-6"/>
<text x="64" y="30" class="m" font-size="9.5" letter-spacing="2" fill="#8b949e">SEND AN</text>
<text x="64" y="52" class="s" font-size="19" font-weight="800" fill="#f0f3f6">Email</text>
<g class="ft"><text x="254" y="44" text-anchor="end" class="s" font-size="22" font-weight="700" fill="#79b8ff">→</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>