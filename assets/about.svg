<svg xmlns="http://www.w3.org/2000/svg" width="864" height="381" viewBox="-2 -2 864 381" xmlns:c2pa="http://c2pa.org/manifest"><defs><style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes pulse{0%,100%{r:4}50%{r:6.5}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(600px)}}
@keyframes grow{0%{transform:scaleX(0)}60%,100%{transform:scaleX(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes sweep{0%{transform:translateX(-300px)}100%{transform:translateX(1200px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes role{0%{opacity:0}4%,30%{opacity:1}34%,100%{opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.tw{animation:tw 3.2s ease-in-out infinite}
.pl{animation:pulse 2.4s ease-in-out infinite}
.fl{stroke-dasharray:4 6;animation:flow 2.2s linear infinite}
.sl{animation:slide 10s ease-in-out infinite}
.gr{transform-box:fill-box;transform-origin:left;animation:grow 3.5s ease-out infinite alternate}
.bk{animation:blink 1s step-end infinite}
.sw{animation:sweep 6s linear infinite}
.ft{animation:float 4s ease-in-out infinite}
@keyframes glm{0%{transform:translateX(-300px) skewX(-20deg)}50%,100%{transform:translateX(1300px) skewX(-20deg)}}
.glm{animation:glm 7s ease-in-out infinite}
</style><linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#2f81f7"/><stop offset=".5" stop-color="#79b8ff" stop-opacity=".6"/><stop offset="1" stop-color="#79b8ff" stop-opacity="0"/></linearGradient><linearGradient id="cardg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2128"/><stop offset="1" stop-color="#161b22"/></linearGradient><linearGradient id="gbd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".45"/><stop offset=".3" stop-color="#79b8ff" stop-opacity=".4"/><stop offset="1" stop-color="#2f81f7" stop-opacity=".15"/></linearGradient><linearGradient id="gsh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".10"/><stop offset=".45" stop-color="#ffffff" stop-opacity=".025"/><stop offset=".46" stop-color="#ffffff" stop-opacity="0"/></linearGradient><linearGradient id="gmv" x1="0" x2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs><text x="0" y="16" class="m" font-size="11" letter-spacing="2.5" fill="#79b8ff">01 / INTRODUCTION</text><text x="0" y="47" class="s" font-size="27" font-weight="800" fill="#f0f3f6">About me</text><rect x="0" y="60" width="860" height="1.5" fill="url(#ln)"/><circle class="sl" cx="14" cy="60.75" r="3" fill="#fff"/><text x="0" y="96" class="s" font-size="15" xml:space="preserve"><tspan fill="#c9d1d9" font-weight="400">I&#x27;m </tspan><tspan fill="#f0f3f6" font-weight="700">Saif Khattab</tspan><tspan fill="#c9d1d9" font-weight="400">, an AI developer in the making and final-year AI student at </tspan><tspan fill="#f0f3f6" font-weight="700">Al-Zaytoonah University of Jordan</tspan><tspan fill="#c9d1d9" font-weight="400">.</tspan></text><text x="0" y="119" class="s" font-size="15" xml:space="preserve"><tspan fill="#c9d1d9" font-weight="400">I focus on </tspan><tspan fill="#79b8ff" font-weight="700">Natural Language Processing</tspan><tspan fill="#c9d1d9" font-weight="400">, </tspan><tspan fill="#2f81f7" font-weight="700">Deep Learning</tspan><tspan fill="#c9d1d9" font-weight="400"> and </tspan><tspan fill="#d0d7de" font-weight="700">Machine Learning</tspan><tspan fill="#c9d1d9" font-weight="400"> with Python —</tspan></text><text x="0" y="142" class="s" font-size="15" xml:space="preserve"><tspan fill="#c9d1d9" font-weight="400">and I enjoy turning ideas into intelligent systems and working AI applications.</tspan></text><rect x="0.0" y="173" width="204.5" height="150" rx="12" fill="url(#cardg)" stroke="none"/><rect x="0.0" y="173" width="204.5" height="150" rx="12" fill="url(#gsh)"/><rect x="0.75" y="173.75" width="203.0" height="148.5" rx="12" fill="none" stroke="url(#gbd)" stroke-width="1.5"/><rect x="12.0" y="173" width="180.5" height="2.5" rx="1.25" fill="#79b8ff"/><rect x="16.0" y="191" width="34" height="34" rx="9" fill="#79b8ff" fill-opacity=".14" stroke="#79b8ff" stroke-opacity=".35"/><path stroke="#79b8ff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M25.0 202h16M25.0 207h16M25.0 212h10M25.0 217h6"/><text x="16.0" y="249" class="s" font-size="16" font-weight="700" fill="#f0f3f6">NLP</text><text x="16.0" y="271" class="s" font-size="12" font-weight="400" fill="#8b949e"><tspan x="16.0" dy="0">Understanding and</tspan><tspan x="16.0" dy="16">processing human</tspan><tspan x="16.0" dy="16">language with AI.</tspan></text><rect x="218.5" y="173" width="204.5" height="150" rx="12" fill="url(#cardg)" stroke="none"/><rect x="218.5" y="173" width="204.5" height="150" rx="12" fill="url(#gsh)"/><rect x="219.25" y="173.75" width="203.0" height="148.5" rx="12" fill="none" stroke="url(#gbd)" stroke-width="1.5"/><rect x="230.5" y="173" width="180.5" height="2.5" rx="1.25" fill="#2f81f7"/><rect x="234.5" y="191" width="34" height="34" rx="9" fill="#2f81f7" fill-opacity=".14" stroke="#2f81f7" stroke-opacity=".35"/><circle stroke="#2f8