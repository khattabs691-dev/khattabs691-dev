191" width="34" height="34" rx="9" fill="#38d9f5" fill-opacity=".14" stroke="#38d9f5" stroke-opacity=".35"/><path stroke="#38d9f5" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M25.0 202h16M25.0 207h16M25.0 212h10M25.0 217h6"/><text x="16.0" y="249" class="s" font-size="16" font-weight="700" fill="#eef2ff">NLP</text><text x="16.0" y="271" class="s" font-size="12" font-weight="400" fill="#8a97ba"><tspan x="16.0" dy="0">Understanding and</tspan><tspan x="16.0" dy="16">processing human</tspan><tspan x="16.0" dy="16">language with AI.</tspan></text><rect x="218.5" y="173" width="204.5" height="150" rx="12" fill="url(#cardg)" stroke="#24305a"/><rect x="230.5" y="173" width="180.5" height="2.5" rx="1.25" fill="#8b6cff"/><rect x="234.5" y="191" width="34" height="34" rx="9" fill="#8b6cff" fill-opacity=".14" stroke="#8b6cff" stroke-opacity=".35"/><circle stroke="#8b6cff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" cx="247.5" cy="205" r="5"/><circle stroke="#8b6cff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" cx="255.5" cy="205" r="5"/><circle stroke="#8b6cff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" cx="251.5" cy="212" r="5"/><text x="234.5" y="249" class="s" font-size="16" font-weight="700" fill="#eef2ff">Deep Learning</text><text x="234.5" y="271" class="s" font-size="12" font-weight="400" fill="#8a97ba"><tspan x="234.5" dy="0">Neural networks</tspan><tspan x="234.5" dy="16">for text, vision and</tspan><tspan x="234.5" dy="16">sequential data.</tspan></text><rect x="437.0" y="173" width="204.5" height="150" rx="12" fill="url(#cardg)" stroke="#24305a"/><rect x="449.0" y="173" width="180.5" height="2.5" rx="1.25" fill="#3ee0a1"/><rect x="453.0" y="191" width="34" height="34" rx="9" fill="#3ee0a1" fill-opacity=".14" stroke="#3ee0a1" stroke-opacity=".35"/><path stroke="#3ee0a1" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M461.0 216V200M461.0 216h18"/><path stroke="#3ee0a1" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M465.0 211l4-5 3 3 5-7"/><text x="453.0" y="249" class="s" font-size="16" font-weight="700" fill="#eef2ff">Machine Learning</text><text x="453.0" y="271" class="s" font-size="12" font-weight="400" fill="#8a97ba"><tspan x="453.0" dy="0">Data preparation,</tspan><tspan x="453.0" dy="16">modeling and</tspan><tspan x="453.0" dy="16">evaluation.</tspan></text><rect x="655.5" y="173" width="204.5" height="150" rx="12" fill="url(#cardg)" stroke="#24305a"/><rect x="667.5" y="173" width="180.5" height="2.5" rx="1.25" fill="#ffc65c"/><rect x="671.5" y="191" width="34" height="34" rx="9" fill="#ffc65c" fill-opacity=".14" stroke="#ffc65c" stroke-opacity=".35"/><path stroke="#ffc65c" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M688.5 200l9 5-9 5-9-5z"/><path stroke="#ffc65c" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M679.5 210l9 5 9-5"/><text x="671.5" y="249" class="s" font-size="16" font-weight="700" fill="#eef2ff">Python Development</text><text x="671.5" y="271" class="s" font-size="12" font-weight="400" fill="#8a97ba"><tspan x="671.5" dy="0">Clean, practical</tspan><tspan x="671.5" dy="16">Python for data</tspan><tspan x="671.5" dy="16">and AI projects.</tspan></text><rect x="0" y="345" width="3" height="24" rx="1.5" fill="url(#ln)"/><text x="16" y="361" class="s" font-size="14.5" font-style="italic" fill="#8a97ba">Building things that matter.</text></svg>